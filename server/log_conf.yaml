version: 1
disable_existing_loggers: False
formatters:
  default:
    "()": graph_service.json_formatter.JSONFormatter
  access:
    "()": graph_service.json_formatter.UvicornAccessJSONFormatter
handlers:
  default:
    formatter: default
    class: logging.StreamHandler
    stream: ext://sys.stderr
  access:
    formatter: access
    class: logging.StreamHandler
    stream: ext://sys.stdout
loggers:
  uvicorn.error:
    level: INFO
    # handlers:
    #   - default
    # propagate: no
  uvicorn.access:
    level: INFO
    # handlers:
    #   - access
    # propagate: no
  httpx:
    level: WARNING
    handlers:
      - default
    propagate: no
root:
  level: INFO
  handlers:
    - default
  propagate: no